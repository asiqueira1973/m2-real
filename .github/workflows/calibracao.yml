# Rotina "calibracao" (seção 4.4): manual ("Executar agora" do painel, 13.1). Nas rotinas
# agendadas ela já roda em seguida, no mesmo workflow.
name: calibracao
on:
  workflow_dispatch:
concurrency: { group: calibracao, cancel-in-progress: false }
jobs:
  calibracao:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run ingestao -- calibracao
